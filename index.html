function nationalCards(nation,country){let groups=new Map();for(const n of nation){let level=n.level||'Principal';if(!groups.has(level))groups.set(level,[]);groups.get(level).push(n)}if(!groups.size)groups.set('Principal',[]);

function logoColor(img,url,c){if(Object.keys(teamPalettes).some(name=>c.name.includes(name)))return;try{let probe=new Image();probe.crossOrigin='anonymous';probe.onload=()=>{try{let canvas=document.createElement('canvas');canvas.width=canvas.height=40;let ctx=canvas.getContext('2d');ctx.drawImage(probe,0,0,40,40);let data=ctx.getImageData(0,0,40,40).data,bins=new Map();for(let i=0;i<data.length;i+=4){let [r,g,b,a]=data.slice(i,i+4),max=Math.max(r,g,b),min=Math.min(r,g,b);if(a<160||max<55||min>220||max-min<35)continue;let hue=Math.round((Math.atan2(Math.sqrt(3)*(g-b),2*r-g-b)*180/Math.PI+360)%360/15)*15;bins.set(hue,(bins.get(hue)||0)+(max-min))}let best=[...bins].sort((a,b)=>b[1]-a[1])[0];if(best&&img.isConnected){let card=img.closest('.clubCard');card.style.setProperty('--team-base',`hsl(${best[0]} 55% 29%)`);card.style.setProperty('--team-accent',`hsl(${best[0]} 80% 74%)`)}}catch{}};probe.src=url}catch{}}

function makeDecision(s){
 const c=byId(s.club),released=s.releasePending||false;
 const mandatory=c.kind==='high'&&s.age>=17?'college':c.kind==='baseBR'&&s.age>=18?(s.overall>=65&&Math.random()<.24?'college':'pro'):c.kind==='college'&&s.age>=22?'pro':null;
 const roll=Math.random(),contract=mandatory||released||roll<.42;
 if(contract){let options=[];if(!mandatory&&!released)options.push({type:'club',club:s.club,label:'Renovar com '+c.name,detail:'Permanecer para a próxima temporada'});
  let weakestNBA=Math.min(...clubs.filter(team=>team.kind==='nba').map(team=>team.rating));
  let nbaNoOffers=released&&c.kind==='nba'&&s.overall<=weakestNBA-3&&Math.random()<.30;
  let kind=released&&c.kind==='nba'&&!nbaNoOffers?'releasedNBA':nbaNoOffers?'pro':mandatory;
  options.push(...offerPool(s,kind,3).map((team,i)=>({type:'club',club:team.id,label:team.name,detail:`${i===2?'Proposta surpresa · ':''}${team.league} · ${countryOf(team)} · força ${ratingForStage(s,team)}`})));
  s.releasePending=false;
  return {kind:'contract',released,nbaNoOffers,title:released?'Você foi desligado da equipe':mandatory==='college'?'Escolha sua universidade':mandatory==='pro'?'Primeiro contrato profissional':'Escolha seu próximo clube',options,draftMessage:''}
 }
 if(roll>=.70&&s.age>=18)return storyDecision(s);
 const events=[
 {title:'Plano de treinos',story:'Como você vai usar a pré-temporada?',photo:sceneImages.training,options:[{type:'effect',label:'Treino intenso',detail:'Mais carga e mais risco de desgaste',min:-1,max:3,photo:sceneImages.training},{type:'effect',label:'Aprimorar fundamentos',detail:'Repetições e leitura de jogo',min:0,max:2,photo:sceneImages.fundamentals},{type:'effect',label:'Descanso e recuperação',detail:'Poupa o corpo para o ano seguinte',min:0,max:1,photo:sceneImages.stretching}]},
 {title:'Decisão fora da quadra',story:'Sua rotina pode mudar sua temporada.',photo:sceneImages.coach,options:[{type:'effect',label:'Treinar com um veterano',detail:'Aprender com quem já viveu isso',min:0,max:3,photo:sceneImages.coach},{type:'effect',label:'Assumir mais minutos',detail:'Mais espaço, mais cobrança',min:-2,max:3,photo:sceneImages.court},{type:'effect',label:'Manter a rotina',detail:'Estabilidade e consistência',min:0,max:1,photo:sceneImages.practice}]},
 {title:'Foco da próxima temporada',story:'Escolha a habilidade em que vai investir.',photo:sceneImages.shooting,options:[{type:'effect',label:'Trabalhar o arremesso',detail:'Ajustar mecânica e volume',min:-1,max:3,photo:sceneImages.shooting},{type:'effect',label:'Fortalecer o físico',detail:'Treino na sala de pesos',min:0,max:2,photo:sceneImages.strength},{type:'effect',label:'Reduzir a carga',detail:'Alongamento e recuperação',min:0,max:1,photo:sceneImages.stretching}]}
 ];
 const event=pick(events.concat(extraTrainingEvents()));return {kind:'training',eventId:null,title:event.title,story:event.story,photo:event.photo,options:event.options.filter(o=>!/^([Ss]ó )?[Mm]anter\b/.test(o.label)).slice(0,rnd(2,3)),draftMessage:''}
}
function simulate(){if(!state||state.pending||state.celebration||isRetired(state))return;const s=state,team=byId(s.club),stats=gameStats(s,team),delta=development(s,stats),awards=seasonAwards(s,team,stats);
 s.history.unshift({year:s.year,age:s.age,club:s.club,stage:stage(s),overallStart:s.overall,delta,stats,awards});s.last=stats;s.overall=clamp(s.overall+delta,38,99);
 const national=nationalSeason(s);if(national?.won)awards.push(award('Campeão — '+national.tournament,'selecao'));s.history[0].national=national;
 const individual=awards.some(a=>a.category==='individual'),belowTeam=team.rating-s.history[0].overallStart>=4;
 const baseRelease=Math.random()<(individual?.05:.15),levelRelease=belowTeam&&Math.random()<.40;
 s.releasePending=['pro','nba'].includes(team.kind)&&(baseRelease||levelRelease);
 if(awards.length)s.celebration={year:s.year,team:national?.won?team.name+' · Seleção '+national.country+' '+national.level:team.name,awards};
 s.age++;s.year++;if(!isRetired(s))s.pending=makeDecision(s);else{flash='Carreira encerrada aos 39 anos: 26 temporadas.';if(!s.celebration)s.summaryOpen=true}
 save();tab='hist';render()
}
function choose(index){const s=state,p=s?.pending,choice=p?.options[index];if(!choice)return;
 if(p.eventId){s.lifeEvents??=[];if(!s.lifeEvents.includes(p.eventId))s.lifeEvents.push(p.eventId)}
 if(choice.type==='club'){s.club=choice.club;flash=choice.label.startsWith('Renovar')?'Contrato renovado.':`Você assinou com ${byId(choice.club).name}.`}
 else if(choice.type==='familyLeave'){s.releasePending=true;s.pending=makeDecision(s);flash='Você ficou com o bebê. Seu contrato foi encerrado; escolha um novo clube para seguir a carreira.';save();render();return}
 else if(choice.type==='forcedRelease'){s.overall=clamp(s.overall+choice.delta,38,99);s.releasePending=true;s.pending=makeDecision(s);flash='Overall '+choice.delta+'. Seu contrato foi encerrado; escolha um novo clube.';save();render();return}
 else if(choice.type==='fixed'){s.overall=clamp(s.overall+choice.delta,38,99);if(choice.community)s.communityProjects=(s.communityProjects||0)+choice.community;flash=`${choice.label}: overall ${choice.delta>=0?'+':''}${choice.delta}${choice.community?' · projeto social registrado':''}.`}
 else{const effect=pick(trainingOutcomes(s,choice));s.overall=clamp(s.overall+effect,38,99);if(s.age<19)s.potential=clamp((s.potential??72)+effect,60,81);flash=`${choice.label}: overall ${effect>=0?'+':''}${effect}.`}
 s.pending=null;save();render()
}
function draft(){const s=state,p=s?.pending;if(!p||s.celebration||s.age<19||s.age>21||s.draftUsed.includes(s.age)||byId(s.club).kind==='nba')return;
 s.draftUsed.push(s.age);const ov=s.overall,usRoute=byId(s.club).kind==='college',chance=ov>=78?.88:ov>=75?.58:ov>=73?.09:0;
 if(Math.random()<Math.min(.98,chance+(usRoute?.06:0))){let range=ov>=78?[1,14]:ov>=75?[15,45]:[46,60],number=rnd(...range),team=pick(clubs.filter(c=>c.kind==='nba'));s.draftPick={year:s.year,number,team:team.name};s.club=team.id;s.pending=null;flash=`Draft ${s.year}: ${number}ª escolha, ${team.name}!`}
 else p.draftMessage=ov<=72?'Você não foi selecionado: com overall 72 ou menos a chance é zero neste modelo. Escolha uma opção abaixo.':'Você não foi selecionado no Draft. Escolha uma opção abaixo.';
 save();render()
}
function decisionModal(){const s=state,p=s.pending;if(!p||s.celebration)return '';const eligible=s.age>=19&&s.age<=21&&!s.draftUsed.includes(s.age)&&byId(s.club).kind!=='nba';return `<div class="decision-back"><section class="panel decision" role="dialog" aria-modal="true" aria-labelledby="decisionTitle"><div class="eyebrow">Temporada ${s.year-1} concluída · ${s.age} anos agora <span class="decisionKind">${p.kind==='contract'?'PROPOSTA':p.kind==='story'?'ESCOLHA DE HISTÓRIA':'TREINO'}</span></div><h2 id="decisionTitle">${esc(p.title)}</h2>${p.photo?`<div class="eventHero"><img src="${esc(p.photo)}" alt="" onerror="this.remove()"><div>${esc(p.story||'')}</div></div>`:''}<p>${p.nbaNoOffers?'Você ficou abaixo do nível mínimo da liga e, desta vez, nenhuma franquia da NBA enviou proposta. Escolha um clube FIBA.':p.released?'Seu contrato acabou. Escolha uma proposta para seguir a carreira.':p.kind==='contract'?'Escolha uma das propostas para seguir a carreira.':p.kind==='story'?'Duas opções, com consequências certas. Qual caminho faz mais sentido para você?':'Escolha o treino antes da próxima temporada. As chances aparecem em cada opção.'}</p>${p.draftMessage?`<p class="decisionResult" role="status">${esc(p.draftMessage)}</p>`:''}<div class="decisionChoices">${p.options.map((o,i)=>`<button class="choice" data-choice="${i}">${p.kind==='story'&&o.photo?`<img class="choicePhoto" src="${esc(o.photo)}" alt="" loading="lazy" onerror="this.remove()">`:o.club?badge(byId(o.club)):o.photo?`<img class="choicePhoto" src="${esc(o.photo)}" alt="" loading="lazy" onerror="this.remove()">`:'<span class="crest">✦</span>'}<span class="details"><strong>${esc(o.label)}</strong><small>${esc(o.detail)}</small>${p.kind==='story'?`<span class="resultPill ${p.tone}">${o.club?'Transferência imediata':o.type==='familyLeave'?'Tempo com o bebê · desligamento':o.type==='forcedRelease'?'-1 OVR · desligamento':`${o.delta>=0?'+':''}${o.delta} OVR garantido${o.community?' · projeto social':''}`}</span>`:o.club?flag(byId(o.club)):o.type==='familyLeave'?'<span class="immediateResult">Contrato encerrado imediatamente</span>':`<span class="chanceBar"><span class="chanceUp">↑ ${effectProbabilities(s,o).up}% subir</span><span class="chanceDown">↓ ${effectProbabilities(s,o).down}% cair</span></span>`}</span></button>`).join('')}</div>${p.kind!=='contract'?`<div class="photoCredits">Fotos: ${[...new Set([p.photo,...p.options.map(o=>o.photo)].filter(Boolean))].map((url,i)=>`<a href="${esc(photoSource(url))}" target="_blank" rel="noopener">fonte ${i+1}</a>`).join(' · ')} · Wikimedia Commons</div>`:''}${eligible?`<div class="draftAction"><div class="eyebrow">Draft NBA · opcional</div><p>OVR ${s.overall} · 78+: chance alta · 75–77: chance moderada · 73–74: chance baixa · até 72: 0%. Universidade americana dá uma pequena vantagem. Você pode tentar uma vez nesta idade.</p><button class="secondary" id="draft">Inscrever-se no Draft</button></div>`:''}</section></div>`}
function setup(){return `<div class="top"><div class="brand"><span class="ball">◉</span> QUADRA LIVRE</div><small>Simulador de carreira · versão 1</small></div><div class="setup"><div class="intro panel"><div class="eyebrow">Sua carreira começa aqui</div><h1>Dos 14 anos<br>ao topo do basquete.</h1><p class="lead">Crie o jogador, comece numa equipe formadora do Brasil ou numa high school dos EUA e avance uma temporada por vez.</p></div><div class="panel"><h2>Criar jogador</h2><p class="muted">A equipe inicial é sorteada entre opções do país de início.</p><form id="create"><div class="formgrid"><label class="field full">Nome do jogador<input name="name" maxlength="40" required placeholder="Ex.: Pedro Rodrigues" autocomplete="name"></label><label class="field">Posição<select name="position"><option>Armador</option><option>Ala-armador</option><option>Ala</option><option>Ala-pivô</option><option>Pivô</option></select></label><label class="field">Nacionalidade<select name="nationality"><option>Brasileira</option><option>Estadunidense</option><option>Argentina</option><option>Uruguaia</option><option>Francesa</option><option>Espanhola</option><option>Outra</option></select></label><label class="field full">Começar a carreira<select name="origin"><option>Brasil</option><option>Estados Unidos</option></select></label></div><button class="primary wide">Criar carreira</button></form><p class="tip">Começo fixo: 14 anos e 40 de overall. Nacionalidade é um dado do atleta; o país de início determina a rota juvenil. Nos EUA, a universidade começa aos 17; no Brasil, a base passa por Sub-14, Sub-16 e Sub-18. O draft pode ser tentado aos 19, 20 ou 21.</p></div></div>`}
function sidebar(){let s=state,c=byId(s.club),total=s.history.length;return `<aside class="panel side"><div class="identity"><div class="avatar">${esc(s.player.name[0].toUpperCase())}</div><div><strong>${esc(s.player.name)}</strong><span>${esc(s.player.position)} · ${esc(s.player.nationality)}</span></div></div><div class="overall"><div><div class="mini">Overall</div><div class="big">${s.overall}</div></div><div class="pill">${Math.min(s.age,39)} anos</div></div><div class="teamline">${badge(c)}<div><strong>${esc(c.name)}</strong><small>${esc(stage(s))} · ${flag(c)}</small></div></div><div class="sidefacts"><div class="fact"><strong>${Math.min(total,26)}/26</strong><span>Temporadas</span></div><div class="fact"><strong>${isRetired(s)?'Fim':s.year}</strong><span>${isRetired(s)?'Aposentado':'Próximo ano'}</span></div></div><button class="primary wide" id="advance" ${isRetired(s)||s.pending?'disabled':''}>${isRetired(s)?'Carreira encerrada':s.pending?'Escolha pendente':`Simular ${s.year}`}</button>${isRetired(s)?'<div class="notice">Aposentado após a temporada dos 39 anos.</div><button class="primary wide summaryButton" id="openSummary">Ver resumo da carreira ✦</button>':''}<button class="ghost wide" id="reset">Recomeçar carreira</button></aside>`}
function history(){let s=state;if(!s.history.length)return '<div class="empty">Nenhuma temporada jogada. Simule o primeiro ano.</div>';return `<div class="historyHead"><span>Ano · clube</span><span>OVR</span><span>Médias</span><span>Conquista</span></div>`+s.history.map(h=>{let c=byId(h.club),t=h.stats;return `<article class="year"><div class="yearhead"><div class="yearteam">${badge(c)}<div><strong>${h.year} · ${esc(c.name)}</strong><div class="yearmeta">${h.age} anos · ${esc(historyStage(h))} · ${flag(c)}</div></div></div></div><div class="pill">${h.overallStart} ${h.delta>=0?'+':''}${h.delta}</div><div class="yearnums"><span><b>${t.pts}</b><small>PTS</small></span><span><b>${t.reb}</b><small>REB</small></span><span><b>${t.ast}</b><small>AST</small></span><span><b>${t.games}</b><small>JOGOS</small></span></div><div class="award">${awardsOf(h).length?awardsOf(h).map(a=>`<span class="awardChip"><img src="${esc(a.image||trophyGeneric)}" alt="" onerror="this.src='${trophyGeneric}'">${esc(a.name)}</span>`).join(''):'—'}${h.national&&!h.national.won?`<small class="nationalNote">${esc(h.national.tournament)} · ${esc(h.national.country)} · ${h.national.pts} PTS</small>`:''}</div></article>`}).join('')}
function catalog(){let types=['Todas','Base BR','High school','NCAA','Brasil pro','NBA','Argentina','Uruguai','Europa','Ásia','Oceania','África'];let europe=['Espanha','França','Alemanha','Itália','Grécia','Turquia','Lituânia','Israel'];let arr=clubs.filter(c=>filter==='Todas'||(filter==='Base BR'&&c.kind==='baseBR')||(filter==='High school'&&c.kind==='high')||(filter==='NCAA'&&c.kind==='college')||(filter==='Brasil pro'&&c.kind==='pro'&&c.country==='Brasil')||(filter==='NBA'&&c.kind==='nba')||(filter==='Europa'&&europe.includes(c.country))||(filter==='Ásia'&&['Japão','China'].includes(c.country))||(filter==='Oceania'&&['Austrália/Nova Zelândia','Nova Zelândia'].includes(c.country))||(filter==='África'&&c.country==='África')||c.country===filter);return `<div class="catalogControls"><label class="sr" for="filter">Filtrar equipes</label><select id="filter">${types.map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><span class="count">${arr.length} equipes exibidas · ${clubs.length} no catálogo</span></div><div class="catalogList">${arr.map(c=>`<div class="offer">${badge(c)}<div class="details"><strong>${esc(c.name)}</strong><small>${esc(c.league)} · ${flag(c)}</small></div><span class="pill">${c.kind==='baseBR'?`Sub-14 ${c.rating} · Sub-16 ${c.rating+8} · Sub-18 ${c.rating+16}`:c.rating}</span></div>`).join('')}</div><p class="footnote">As notas são estimativas de jogo calibradas com a classificação 2025/26 da NBB e resultados recentes da NBA, ACB e NBL; não são rankings oficiais nem se atualizam automaticamente. A categoria juvenil acompanha a idade do jogador; a presença de cada clube em todas as faixas não foi validada individualmente. Em ligas com menos de 12 integrantes, o catálogo combina competições identificadas separadamente e pode incluir participantes de temporadas diferentes. Os escudos do Escudos FC, NBA e universidades usam URLs diretas; outras equipes usam busca complementar. Quando uma imagem não existe na fonte, aparece o monograma. <a href="https://lnb.com.br/nbb/classificacao/" target="_blank" rel="noopener">NBB 2025/26</a> · <a href="https://www.nba.com/playoffs/2026" target="_blank" rel="noopener">NBA 2026</a> · <a href="https://www.nbl.com.au/news/nbl26-champions-sydney-kings-kendric-davis" target="_blank" rel="noopener">NBL 2026</a> · <a href="https://www.ncaa.org/division-i/member-schools/" target="_blank" rel="noopener">NCAA</a> · <a href="https://www.nbl.com.au/" target="_blank" rel="noopener">NBL Austrália</a>.</p>`}
function dashboard(){let s=state,c=byId(s.club),st=s.last;return `<div class="top"><div class="brand"><span class="ball">◉</span> QUADRA LIVRE</div><small>Carreira de basquete · ${esc(s.player.origin)}</small></div><div class="layout">${sidebar()}<main class="main"><div class="intro compact panel"><div class="eyebrow">${isRetired(s)?'Carreira encerrada':`Temporada ${s.year}`} · ${esc(stage(s))}</div><h1>${esc(s.player.name)}</h1><p class="lead">${esc(s.player.position)} · ${esc(c.name)} · ${flag(c)}</p>${isRetired(s)?'<button class="primary summaryHeroButton" id="openSummaryMain">✦ Ver resumo completo da carreira</button>':''}</div>${flash?`<p class="flash" role="status">${esc(flash)}</p>`:''}<div class="stats compactStats"><div class="stat"><strong>${s.overall}</strong><span>Overall</span></div><div class="stat"><strong>${st?st.pts:'—'}</strong><span>Pontos</span></div><div class="stat"><strong>${st?st.reb:'—'}</strong><span>Rebotes</span></div><div class="stat"><strong>${st?st.ast:'—'}</strong><span>Assistências</span></div><div class="stat"><strong>${s.history.reduce((n,h)=>n+awardsOf(h).filter(a=>['coletivo','selecao'].includes(a.category)).length,0)}</strong><span>Títulos</span></div></div><section class="panel content"><div class="tabs" role="tablist" aria-label="Áreas da carreira"><button class="tab ${tab==='hist'?'active':''}" data-tab="hist" role="tab" aria-selected="${tab==='hist'}">Histórico · ${s.history.length} temporadas</button><button class="tab ${tab==='clubs'?'active':''}" data-tab="clubs" role="tab" aria-selected="${tab==='clubs'}">Equipes</button></div><div role="tabpanel">${tab==='hist'?history():catalog()}</div></section><p class="footnote">Notas de jogo baseadas em resultados recentes onde disponíveis; estatísticas, propostas e decisões são simuladas.</p></main></div>${s.summaryOpen?careerSummary():s.celebration?celebrationModal():decisionModal()}`}
function render(){document.getElementById('app').innerHTML=(state?dashboard():setup())+'<button class="settingsTrigger" id="openSettings" aria-label="Abrir configurações">⚙ <span>Configurações</span></button>'+settingsModal();applyTheme();document.getElementById('openSettings')?.addEventListener('click',()=>{settingsOpen=true;render()});document.getElementById('closeSettings')?.addEventListener('click',()=>{settingsOpen=false;render()});document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));document.getElementById('create')?.addEventListener('submit',init);document.getElementById('advance')?.addEventListener('click',simulate);document.getElementById('draft')?.addEventListener('click',draft);document.getElementById('celebrateDone')?.addEventListener('click',dismissCelebration);document.getElementById('openSummary')?.addEventListener('click',openSummary);document.getElementById('openSummaryMain')?.addEventListener('click',openSummary);document.getElementById('closeSummary')?.addEventListener('click',closeSummary);document.getElementById('closeSummaryBottom')?.addEventListener('click',closeSummary);document.getElementById('reset')?.addEventListener('click',()=>{if(confirm('Apagar esta carreira e recomeçar?')){localStorage.removeItem(KEY);state=null;flash='';tab='hist';render()}});document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;flash='';render()});document.getElementById('filter')?.addEventListener('change',e=>{filter=e.target.value;render()});loadLogos();loadCardLogos();loadMapLogos()}
if(state){state.potential??=clamp(state.overall+Math.max(0,19-state.age)*6,60,78);state.pending??=null;state.celebration??=null;state.summaryOpen=false;if(state.pending&&!state.pending.options)state.pending=null}render();
